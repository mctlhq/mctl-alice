name: release-deploy

# Manual redeploy only. Releases are cut by release-please.yml, which tags the
# version and dispatches the same centralized build+deploy workflow in
# mctl-gitops. This one stays for re-running a deploy of an existing tag by hand
# (for example a failed dispatch or a rollback) and no longer reacts to tag
# pushes: release-please creates the tag with an App token, and a second
# trigger here would deploy every release twice.
# mctl-gitops builds & pushes ghcr.io/mctlhq/mctl-alice:<tag>, bumps the image
# tag in platform-gitops/services/labs/mctl-alice/values.yaml, and lets ArgoCD sync it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and deploy (e.g. 2.14.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployment tag
        id: tag
        run: |
          echo "val=$TAG_INPUT" >> "$GITHUB_OUTPUT"
        env:
          TAG_INPUT: ${{ inputs.tag }}

      # The cross-repo dispatch needs a token that can run workflows in
      # mctl-gitops; the mctl-agents App provides it (org variable
      # AGENTS_APP_CLIENT_ID and org secret AGENTS_APP_PRIVATE_KEY,
      # visibility=all).
      - name: Generate Platform App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops

      - name: Dispatch centralized release-deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.val }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-alice \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-alice \
            -f image_tag="$TAG" \
            -f team_name=labs \
            -f component_name=mctl-alice
